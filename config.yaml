# -----------------------------------------------------------------------------
# Configuration for the Advanced RAG Legal Assistant
# -----------------------------------------------------------------------------
# This file is optional. If it's missing or invalid, the application
# will use sensible default settings.
# -----------------------------------------------------------------------------

# --- Model and Embedding Settings ---
llm:
  # Anthropic's model for generation
  generation_model: "claude-3-haiku-20240307"
  # Local, open-source model for vectorization. Downloads automatically.
  embedding_model: "all-MiniLM-L6-v2"
  # Temperature for the generation model (0.0 to 1.0). Lower is more factual.
  temperature: 0.1

# --- RAG Pipeline Settings ---
retrieval:
  # The search strategy for retrieving documents.
  # Options: "similarity", "mmr" (Maximal Marginal Relevance for diverse results)
  search_type: "mmr"
  # Number of relevant document chunks to retrieve for the answer.
  k_results: 5

chunking:
  # The size of each text chunk in characters.
  chunk_size: 1500
  # The overlap between consecutive chunks to maintain context.
  chunk_overlap: 200

# --- User Interface Settings ---
ui:
  # Enable or disable colored output in the console (for CLI mode)
  enable_colors: true
  # Set to 'debug' for verbose logging.
  log_level: "info"
