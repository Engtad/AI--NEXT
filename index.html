<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Legal Assistant</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f0f2f5;
            --card-background: #ffffff;
            --text-color: #333;
            --user-bubble: #e6f2ff;
            --assistant-bubble: #f8f9fa;
            --error-color: #dc3545;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-header {
            background-color: #1a253c;
            color: white;
            padding: 1rem 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .chat-header button:hover {
            background-color: #0056b3;
        }
        .chat-log {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message-bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            margin-bottom: 1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .user-bubble {
            background-color: var(--user-bubble);
            color: #0056b3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .assistant-bubble {
            background-color: var(--assistant-bubble);
            border: 1px solid #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid #e0e0e0;
            background-color: #fdfdfd;
            display: flex;
        }
        .chat-input-area textarea {
            flex-grow: 1;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 1rem;
        }
        .chat-input-area button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 0.5rem;
            transition: background-color 0.2s;
        }
        .chat-input-area button:hover { background-color: #0056b3; }
        .spinner {
            align-self: center;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            padding: 2rem;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h2 { margin-top: 0; }
        .modal-content input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; margin-bottom: 1rem; }
        .modal-content input[type="file"] { margin-top: 0.5rem; }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>AI Legal Assistant</span>
        <button id="save-chat-btn">Save Chat to PDF</button>
    </div>
    <div class="chat-log" id="chat-log">
        <div class="assistant-bubble" id="initial-message">Please upload documents to begin.</div>
    </div>
    <div class="spinner" id="spinner"></div>
    <form id="ask-form" class="chat-input-area">
        <textarea id="question" name="question" placeholder="Ask a question about your documents..."></textarea>
        <button type="submit">Send</button>
    </form>
</div>

<!-- Upload Modal -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <span class="close-button" id="closeUploadModal">&times;</span>
        <h2>Upload Documents</h2>
        <form id="upload-form">
            <label for="files">Select PDF, DOCX, or TXT files:</label>
            <input type="file" id="files" name="files" multiple accept=".pdf,.docx,.txt">
            <br><br>
            <button type="submit">Upload and Process</button>
        </form>
    </div>
</div>

<!-- Export Modal -->
<div id="exportModal" class="modal">
    <div class="modal-content">
        <span class="close-button" id="closeExportModal">&times;</span>
        <h2>Export Case Details</h2>
        <form id="export-form">
            <label for="case-name">Case Name:</label>
            <input type="text" id="case-name" placeholder="e.g., Google LLC v. Oracle America, Inc.">
            <br><br>
            <label for="case-number">Case Number:</label>
            <input type="text" id="case-number" placeholder="e.g., No. 18-956">
            <br><br>
            <div id="export-error" style="color: var(--error-color); margin-bottom: 1rem; display: none; text-align: center;"></div>
            <button type="submit">Download PDF</button>
        </form>
    </div>
</div>

<script>
    const askForm = document.getElementById('ask-form');
    const spinner = document.getElementById('spinner');
    const chatLog = document.getElementById('chat-log');
    const initialMessage = document.getElementById('initial-message');

    // Modals
    const uploadModal = document.getElementById('uploadModal');
    const exportModal = document.getElementById('exportModal');
    const saveChatBtn = document.getElementById('save-chat-btn');
    const closeUploadModal = document.getElementById('closeUploadModal');
    const closeExportModal = document.getElementById('closeExportModal');

    let isReadyForQuestions = false;

    // --- Show upload modal on page load ---
    window.onload = () => {
        uploadModal.style.display = 'flex';
    };

    // --- Modal Controls ---
    saveChatBtn.onclick = () => { 
        document.getElementById('export-error').style.display = 'none'; // Hide previous errors when opening
        exportModal.style.display = 'flex'; 
    }
    closeUploadModal.onclick = () => { uploadModal.style.display = 'none'; }
    closeExportModal.onclick = () => { exportModal.style.display = 'none'; }
    window.onclick = (event) => {
        if (event.target == uploadModal) uploadModal.style.display = 'none';
        if (event.target == exportModal) exportModal.style.display = 'none';
    }

    function addMessage(text, type) {
        if (initialMessage && initialMessage.parentElement) {
            initialMessage.remove(); // Remove the initial "Please upload" message
        }
        const bubble = document.createElement('div');
        bubble.className = `message-bubble ${type}-bubble`;
        bubble.textContent = text;
        chatLog.appendChild(bubble);
        chatLog.scrollTop = chatLog.scrollHeight; // Auto-scroll to the bottom
    }

    // --- Handle File Upload ---
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        spinner.style.display = 'block';
        addMessage('Processing documents... This may take a moment.', 'assistant');
        
        try {
            const response = await fetch('/upload', { method: 'POST', body: formData });
            const result = await response.json();
            
            if (!response.ok) {
                throw new Error(result.error || 'An unknown error occurred during upload.');
            }

            addMessage(result.message, 'assistant');
            
            // Auto-populate the export form with extracted details
            if (result.caseDetails) {
                const caseNameInput = document.getElementById('case-name');
                const caseNumberInput = document.getElementById('case-number');
                
                caseNameInput.value = result.caseDetails.caseName !== 'N/A' ? result.caseDetails.caseName : '';
                caseNumberInput.value = result.caseDetails.caseNumber !== 'N/A' ? result.caseDetails.caseNumber : '';
            }

            isReadyForQuestions = true;
            uploadModal.style.display = 'none';

        } catch (error) {
            addMessage(`Upload Failed: ${error.message}`, 'assistant');
        } finally {
            spinner.style.display = 'none';
        }
    });

    // --- Handle Asking a Question ---
    askForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isReadyForQuestions) {
            addMessage("Please upload documents first before asking a question.", 'assistant');
            return;
        }
        const questionInput = document.getElementById('question');
        const question = questionInput.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        questionInput.value = '';
        spinner.style.display = 'block';

        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error);
            
            let answerText = result.answer || "No answer found.";
            if (result.sources && result.sources.length > 0) {
                const sourceFiles = [...new Set(result.sources.map(s => s.source))].join(', ');
                answerText += `\n\nSources: ${sourceFiles}`;
            }
            addMessage(answerText, 'assistant');
        } catch (error) {
            addMessage(`Error: ${error.message}`, 'assistant');
        } finally {
            spinner.style.display = 'none';
        }
    });

    // --- Handle PDF Export ---
    document.getElementById('export-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const caseName = document.getElementById('case-name').value;
        const caseNumber = document.getElementById('case-number').value;
        const errorDiv = document.getElementById('export-error');
        errorDiv.style.display = 'none';

        if (!caseName || !caseNumber) {
            errorDiv.textContent = "Please provide both a Case Name and Case Number.";
            errorDiv.style.display = 'block';
            return;
        }
        
        spinner.style.display = 'block';

        try {
            const response = await fetch('/export_pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ caseName, caseNumber }),
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `case_report_${caseName.replace(/\s/g, '_')}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                exportModal.style.display = 'none';
            } else {
                const result = await response.json();
                throw new Error(result.error || "Failed to download PDF.");
            }
        } catch (error) {
            errorDiv.textContent = `Export Failed: ${error.message}`;
            errorDiv.style.display = 'block';
        } finally {
            spinner.style.display = 'none';
        }
    });
</script>

</body>
</html>
